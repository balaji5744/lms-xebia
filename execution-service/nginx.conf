# Nginx Reverse Proxy Configuration Template for EduCorp LMS Code Judge
# Replace "judge.yourdomain.com" with your actual domain/subdomain on the VPS.

server {
    listen 80;
    server_name judge.yourdomain.com;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name judge.yourdomain.com;

    # Let's Encrypt SSL Path (Certbot will manage these lines automatically)
    ssl_certificate /etc/letsencrypt/live/judge.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/judge.yourdomain.com/privkey.pem;
    
    # Restrict proxying strictly to the /execute API endpoint
    location /execute {
        proxy_pass http://127.0.0.1:8081/execute;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded-for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable response buffering for fast batch updates
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Deny all other requests to prevent public discovery
    location / {
        return 404;
    }
}
