version: '3.8'

services:
  execution-service:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - PORT=8081
      - EXECUTION_SERVICE_API_KEY=${EXECUTION_SERVICE_API_KEY}
      - HOST_SCRATCH_DIR=${HOST_SCRATCH_DIR}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scratch:/app/scratch
