spring:
  application:
    name: geeknito-backend

  # Database Configuration (Connecting to PostgreSQL)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/enterprise_lms_db}
    username: ${SPRING_DATASOURCE_USERNAME:lms_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin_secure_pass_2026}
    driver-class-name: org.postgresql.Driver

  # JPA & Hibernate Settings
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        # Enable statistics to track and troubleshoot N+1 issues
        generate_statistics: true

  # Redis Configuration (For second-level query caching and active session storage)
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 2000

# Logging Configurations to audit queries and optimization behaviors
logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG                      # Logs actual SQL queries
    org.hibernate.orm.jdbc.bind: TRACE            # Logs query parameter binding values
    org.springframework.cache: TRACE              # Logs cache hits/misses for Redis

# Server port configuration
server:
  port: 8080
  servlet:
    context-path: /api/v1

# CORS allowed origins config
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

app:
  file-download-base-url: ${APP_FILE_DOWNLOAD_BASE_URL:http://localhost:8080}

