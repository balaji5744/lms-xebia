spring:
  application:
    name: geeknito-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local} # Defaults to local development profile

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Server port and context path configuration
server:
  port: 8080
  servlet:
    context-path: /api/v1

# CORS allowed origins config
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

app:
  file-download-base-url: ${APP_FILE_DOWNLOAD_BASE_URL:http://localhost:8080/api/v1}

# Spring Boot Actuator Configuration for health, info, and metrics tracking
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always # Shows detailed DB and Redis check information
      probes:
        enabled: true # Exposes standard Kubernetes/Render liveness & readiness probes
